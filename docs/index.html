<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piano check">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Piano check</title>
<style>
  :root{--bg:#fff;--fg:#222;--muted:#666;--line:#ddd;--card:#fafafa;--ok:#30a46c;--warn:#f5a524;--bad:#e5484d}
  @media (prefers-color-scheme: dark){:root{--bg:#1b1b1d;--fg:#eee;--muted:#aaa;--line:#444;--card:#242427}}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--fg);cursor:pointer;min-height:40px}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  button:disabled{opacity:.45}
  input[type=text]{font:inherit;width:80px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);min-height:24px}
  label{display:inline-flex;align-items:center;gap:6px}
  select{max-width:220px}
  #status{color:var(--muted);flex:1;min-width:200px}
  .meter{width:90px;height:10px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
  main{display:grid;grid-template-columns:1fr 300px;gap:16px;padding:12px 16px;max-width:1300px;margin:0 auto}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  #wrap{position:relative;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}
  #sheet{min-height:200px;width:100%;color:#000}
  #marker{position:absolute;pointer-events:none;background:#2563eb;opacity:.8;border-radius:2px;display:none;
    box-shadow:0 0 6px #2563eb}
  aside h2{font-size:15px;margin:0 0 8px}
  #list{max-height:75vh;overflow:auto}
  .item{border:1px solid var(--line);border-left:5px solid var(--bad);background:var(--card);
    border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:14px;cursor:pointer}
  .item.skipped{border-left-color:#8e4ec6}.item.missing{border-left-color:var(--warn)}
  .item.retried{opacity:.55}
  .item b{display:block}.item small{color:var(--muted)}
  .legend span{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
  .legend{font-size:13px;color:var(--muted);margin:0 0 8px}
  #heard{font-size:13px;color:var(--muted)}
  .band{position:absolute;pointer-events:none;border-radius:4px;mix-blend-mode:multiply}
  .band.fast{background:rgba(20,184,166,.22);outline:2px solid rgba(20,184,166,.7)}
  .band.slow{background:rgba(99,102,241,.2);outline:2px solid rgba(99,102,241,.7)}
  .band span{position:absolute;left:2px;top:-16px;font-size:11px;font-weight:600;white-space:nowrap}
  .band.fast span{color:#0d9488}.band.slow span{color:#4f46e5}
  #rhythm{margin-top:18px}#rhythm h2{font-size:15px;margin:0 0 6px}#rhythm .sum{font-size:13px;color:var(--muted);margin-bottom:8px}
  .reg{border:1px solid var(--line);border-left:5px solid #94a3b8;background:var(--card);border-radius:6px;
    padding:5px 10px;margin-bottom:5px;font-size:14px;cursor:pointer}
  .reg.fast{border-left-color:#14b8a6}.reg.slow{border-left-color:#6366f1}
  #chart{display:block;margin:8px 0}
  .link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px;min-height:0}
</style>
</head>
<body>
<header>
  <button class="primary" id="start">New practice</button>
  <button id="stop" disabled>Stop</button>
  <select id="score" title="Music file"></select>
  <button id="open" title="Open a MusicXML file from this device">Open file...</button>
  <!-- no accept filter on purpose: iPad greys out .musicxml/.mxl files because it does not know those types -->
  <input type="file" id="file" style="display:none">
  <label>Measures <input type="text" id="range" placeholder="all" title="e.g. 5-12" inputmode="text" autocapitalize="off"></label>
  <label title="Chords the microphone did not pick up. Often a detection miss rather than a real skip."><input type="checkbox" id="showskip"> show not-heard</label>
  <div class="meter" title="microphone level"><i id="lvl"></i></div>
  <div id="status">Loading...</div>
  <div id="heard"></div>
  <button class="link" id="replay" title="Test with a recording instead of the microphone">test with a recording</button>
  <input type="file" id="audiofile" accept="audio/*" style="display:none">
</header>
<main>
  <div>
    <p class="legend"><span style="background:#f5a524"></span>key not played
      <span style="background:#e5484d"></span>wrong key (label above)
      <span style="background:#8e4ec6"></span>chord not heard
      <span style="background:#2563eb"></span>beat position
      <span style="background:#14b8a6"></span>played too fast
      <span style="background:#6366f1"></span>played too slow</p>
    <div id="wrap"><div id="sheet">Loading sheet music...</div><div id="bands"></div><div id="marker"></div></div>
  </div>
  <aside><h2>Mistakes (<span id="count">0</span>)</h2><div id="list"></div>
    <div id="rhythm"><h2>Rhythm</h2><div id="rhythmBody"><small>Play a few measures, then pause or press Stop to see how steady your speed was.</small></div></div></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
